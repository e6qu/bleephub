name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - javascript-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - name: Build compiled languages
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          upload: always
          wait-for-processing: true
      - name: Test the SARIF policy
        if: matrix.language == 'go'
        run: python3 -m unittest scripts/test_check_codeql_sarif.py
      - name: Reject CodeQL findings
        env:
          CODEQL_SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
        run: python3 scripts/check-codeql-sarif.py "$CODEQL_SARIF_DIRECTORY"
