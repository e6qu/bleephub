version: 2

# A release must exist for a full day before an automated update may consume
# it. This limits exposure to compromised or immediately-yanked releases while
# the CI dependency-age ratchet independently checks the resolved graph.
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /sdk-tests
      - /terraform/wake
      - /test/terraform-sockerless
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: daily
    cooldown:
      default-days: 1
