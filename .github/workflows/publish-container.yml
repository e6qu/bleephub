name: Publish Bleephub container

on:
  push:
    branches: [main]
    # A release is the same pipeline entered from a tag rather than a second
    # workflow beside it, because two workflows building the same Dockerfiles
    # drift and then ship different bytes under the two names.
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

concurrency:
  group: publish-bleephub-${{ github.ref_name }}
  # Never cancel a publish in progress. This job pushes the two
  # architecture tags ($TAG-amd64, $TAG-arm64) and only then assembles the
  # combined manifest ($TAG); cancelling in that window leaves orphan
  # architecture tags with no manifest to resolve them. That is true for a
  # branch (commit-tagged) publish as much as for a tag: both push immutable
  # registry artifacts a re-push cannot cleanly re-drive. Concurrent
  # publishes queue instead.
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/e6qu/bleephub
  RUNNER_IMAGE: ghcr.io/e6qu/bleephub-runner
  WAKE_IMAGE: ghcr.io/e6qu/bleephub-wake

jobs:
  metadata:
    name: Container tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      version: ${{ steps.version.outputs.value }}
      is_release: ${{ steps.version.outputs.is_release }}
      published_at: ${{ steps.published_at.outputs.value }}
    steps:
      - id: tag
        name: Derive short commit SHA tag
        env:
          SHA: ${{ github.sha }}
        run: echo "value=${SHA::12}" >> "$GITHUB_OUTPUT"
      # Every build is addressable by commit; a tagged build is additionally
      # addressable by version. Deriving both here keeps the branch and tag
      # entry points on one code path.
      - id: version
        name: Derive the release version
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${REF#refs/tags/v}" != "$REF" ]; then
            version="${REF#refs/tags/v}"
            if ! printf '%s' "$version" \
              | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Tag $REF is not a semantic version"
              exit 1
            fi
            echo "value=$version" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
      - id: published_at
        name: Record release publication time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build:
    name: Bleephub images (${{ matrix.arch.suffix }})
    needs: metadata
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { platform: linux/amd64, runner: ubuntu-latest, suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish native architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.arch.platform }}
          push: true
          # Amazon Elastic Container Service on AWS Fargate resolves a native
          # image manifest from its architecture tag. Buildx provenance would
          # publish that tag as an OCI index whose child manifest is not
          # anonymously retrievable from GitHub Container Registry.
          provenance: false
          tags: ${{ env.IMAGE }}:${{ needs.metadata.outputs.tag }}-${{ matrix.arch.suffix }}
          # The release image carried no OCI labels while the runner image
          # beside it carried three. Without image.source a GitHub Container
          # Registry package is not linked to its repository, so it does not
          # inherit the repository's visibility or licence and shows no source
          # link. image.licenses is now answerable because the repository has a
          # LICENSE.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.published_at }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version || needs.metadata.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          build-args: |
            BLEEPHUB_VERSION=${{ needs.metadata.outputs.version || needs.metadata.outputs.tag }}
            BLEEPHUB_COMMIT=${{ github.sha }}
            BLEEPHUB_PUBLISHED_AT=${{ needs.metadata.outputs.published_at }}
          cache-from: type=gha,scope=bleephub-${{ matrix.arch.suffix }}
          cache-to: type=gha,scope=bleephub-${{ matrix.arch.suffix }},mode=max
      - name: Build and publish native architecture runner image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.runner
          platforms: ${{ matrix.arch.platform }}
          push: true
          provenance: false
          tags: ${{ env.RUNNER_IMAGE }}:${{ needs.metadata.outputs.tag }}-${{ matrix.arch.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.published_at }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version || needs.metadata.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=bleephub-runner-${{ matrix.arch.suffix }}
          cache-to: type=gha,scope=bleephub-runner-${{ matrix.arch.suffix }},mode=max

  manifest:
    name: Bleephub multi-architecture manifests
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless signing exchanges this for a Sigstore certificate; there is no
      # long-lived key to hold or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          # A tagged build gets `1.2.3` and `latest` pointing at the same
          # digest as its commit tag, so a release is addressable by version
          # without ever being a separate build of the same source.
          bleephub_tags=(--tag "$IMAGE:$TAG")
          runner_tags=(--tag "$RUNNER_IMAGE:$TAG")
          if [ -n "$VERSION" ]; then
            bleephub_tags+=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:latest")
            runner_tags+=(--tag "$RUNNER_IMAGE:$VERSION" --tag "$RUNNER_IMAGE:latest")
          fi
          docker buildx imagetools create \
            "${bleephub_tags[@]}" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
          docker buildx imagetools create \
            "${runner_tags[@]}" \
            "$RUNNER_IMAGE:$TAG-amd64" \
            "$RUNNER_IMAGE:$TAG-arm64"
      # Four public images were published with no signature, no bill of
      # materials and no vulnerability scan, so a consumer had no way to
      # establish that a given digest came from this repository rather than
      # from anyone else who could write to the registry.
      #
      # Signing and attesting happen here, against the multi-architecture
      # manifest, rather than through buildx's own provenance and sbom flags:
      # those republish an architecture tag as an OCI index whose child
      # manifest AWS Fargate cannot resolve, which is why provenance is
      # explicitly disabled in the build job above. Cosign attaches its
      # artifacts as separate tags and leaves the image manifests untouched.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
      - name: Sign the manifests and attach a bill of materials
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          for image in "$IMAGE" "$RUNNER_IMAGE"; do
            digest=$(docker buildx imagetools inspect "$image:$TAG" \
              --format '{{json .Manifest}}' | jq -r .digest)
            scripts/retry-command.sh cosign sign --yes "$image@$digest"
            syft "$image@$digest" -o spdx-json > sbom.spdx.json

            # Rekor's public instance limits an attestation to 100 KB. The
            # release SBOM is about 20 MB, so embedding it in the attestation
            # can never succeed. Store the complete document as an OCI
            # referrer, sign that immutable artifact, and attest its URI and
            # content digest from the image as recommended by Sigstore.
            sbom_reference=$(
              scripts/retry-command.sh oras attach \
                --artifact-type application/spdx+json \
                --format go-template \
                --template '{{.reference}}' \
                "$image@$digest" \
                sbom.spdx.json:application/spdx+json
            )
            scripts/retry-command.sh cosign sign --yes "$sbom_reference"
            sbom_hash="sha256:$(sha256sum sbom.spdx.json | cut -d ' ' -f 1)"
            jq -n \
              --arg sbom_path "$sbom_reference" \
              --arg sbom_hash "$sbom_hash" \
              '{sbom_path: $sbom_path, sbom_hash: $sbom_hash}' \
              > sbom-reference.json
            test "$(wc -c < sbom-reference.json)" -lt 100000
            scripts/retry-command.sh cosign attest --yes \
              --predicate sbom-reference.json \
              --type custom \
              "$image@$digest"
          done

  scan:
    name: Vulnerability scan
    needs: [metadata, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Reported into code scanning rather than failing the publish. A
      # published image cannot be unpublished by turning a job red, and a
      # gate that blocks every release the moment a base-image advisory lands
      # gets bypassed rather than fixed. The pull-request build is where a
      # scan can still change the outcome, and it runs there too.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.metadata.outputs.tag }}
          format: sarif
          output: trivy-bleephub.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-bleephub.sarif
          category: trivy-bleephub

  startup-bundle:
    name: Bleephub startup bundle
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2
      - name: Build the versioned static startup bundle
        env:
          BLEEPHUB_VERSION: ${{ needs.metadata.outputs.tag }}
          BLEEPHUB_PUBLISHED_AT: ${{ needs.metadata.outputs.published_at }}
        run: scripts/build-bleephub-startup.sh .build/bleephub-ecs
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify the startup ZIP as an OCI GitHub Package
        env:
          IMAGE: ghcr.io/e6qu/bleephub-startup:${{ needs.metadata.outputs.tag }}
          PUBLISHED_AT: ${{ needs.metadata.outputs.published_at }}
        run: |
          set -euo pipefail
          (
            cd .build/bleephub-ecs
            oras push "$IMAGE" \
              --artifact-type application/vnd.e6qu.bleephub.startup.v1+zip \
              --annotation org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              --annotation org.opencontainers.image.revision=${{ github.sha }} \
              --annotation "org.opencontainers.image.created=$PUBLISHED_AT" \
              bleephub-startup.zip:application/zip
          )
          mkdir verified
          oras pull "$IMAGE" --output verified
          test -s verified/bleephub-startup.zip

  wake-bundle:
    name: Bleephub wake-listener bundle
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2
      - name: Build the Linux ARM64 wake-listener ZIP
        run: scripts/build-bleephub-wake.sh .build/bleephub-wake
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify the wake-listener ZIP as an OCI GitHub Package
        env:
          IMAGE: ${{ env.WAKE_IMAGE }}:${{ needs.metadata.outputs.tag }}
          PUBLISHED_AT: ${{ needs.metadata.outputs.published_at }}
        run: |
          set -euo pipefail
          (
            cd .build/bleephub-wake
            oras push "$IMAGE" \
              --artifact-type application/vnd.e6qu.bleephub.wake.v1+zip \
              --annotation org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              --annotation org.opencontainers.image.revision=${{ github.sha }} \
              --annotation "org.opencontainers.image.created=$PUBLISHED_AT" \
              bleephub-wake.zip:application/zip
          )
          mkdir verified
          oras pull "$IMAGE" --output verified
          test -s verified/bleephub-wake.zip

  release:
    name: GitHub Release
    needs: [metadata, manifest, startup-bundle, wake-bundle]
    if: needs.metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release notes are generated by diffing against the previous tag, so
          # a shallow clone would produce notes covering one commit.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release artifacts must never consume mutable cross-run caches.
          cache: false
      # The bundles are rebuilt here rather than passed between jobs because an
      # artifact upload would let the release attach different bytes from the
      # ones published to the registry. Both come from the same tagged tree.
      - name: Rebuild the release bundles for attachment
        env:
          BLEEPHUB_VERSION: ${{ needs.metadata.outputs.version }}
          BLEEPHUB_PUBLISHED_AT: ${{ needs.metadata.outputs.published_at }}
        run: |
          set -euo pipefail
          scripts/build-bleephub-startup.sh .build/bleephub-ecs
          scripts/build-bleephub-wake.sh .build/bleephub-wake
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          # --notes is prepended to --generate-notes output, so the commit log
          # since the previous tag is the changelog and this block is the
          # header above it.
          # shellcheck disable=SC2016  # the backticks are markdown code spans
          notes=$(printf '## Container images\n\n```\ndocker pull %s:%s\ndocker pull %s:%s\n```\n\nBuilt from `%s`, also published as `%s:%s`.\n' \
            "$IMAGE" "$VERSION" "$RUNNER_IMAGE" "$VERSION" "$GITHUB_SHA" "$IMAGE" "$TAG")
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$notes" \
            --generate-notes \
            "${prerelease[@]}" \
            .build/bleephub-ecs/bleephub-startup.zip \
            .build/bleephub-wake/bleephub-wake.zip

  prune:
    name: Retain 20 Bleephub releases
    needs: [metadata, manifest, startup-bundle, wake-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Delete package versions outside the newest 20 releases
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          package_owner_type="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.type')"
          case "$package_owner_type" in
            Organization) package_namespace="orgs" ;;
            User) package_namespace="users" ;;
            *)
              echo "::error::Unsupported GitHub package owner type: $package_owner_type"
              exit 1
              ;;
          esac
          retain_releases() {
            local package="$1" include_architectures="$2" versions_file keep_tags
            versions_file="$(mktemp)"
            gh api --paginate \
              "/$package_namespace/$OWNER/packages/container/$package/versions?per_page=100" \
              | jq -s 'add' > "$versions_file"
            # Commit-tagged versions rotate at twenty. Semantic-version tags and
            # `latest` are retained without limit: a published release is a
            # promise that `1.2.3` keeps resolving, and the twenty-first commit
            # after it must not quietly break that.
            keep_tags="$({
              jq -r '[ .[] | select(any(.metadata.container.tags[]?; test("^[0-9a-f]{12}$"))) ] | sort_by(.created_at) | reverse | .[:20] | .[] | .metadata.container.tags[] | select(test("^[0-9a-f]{12}$"))' "$versions_file" \
                | while IFS= read -r tag; do
                    printf '%s\n' "$tag"
                    if [ "$include_architectures" = true ]; then printf '%s\n' "$tag-amd64" "$tag-arm64"; fi
                  done
              jq -r '.[] | .metadata.container.tags[]? | select(test("^([0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?|latest)$"))' "$versions_file"
            } | jq -R . | jq -s 'unique')"
            # An empty keep-set is never legitimate: the release this workflow
            # just published is always among the newest twenty, so a zero-length
            # keep set means the versions query or the tag extraction failed. The
            # delete filter below keeps a version only if one of its tags is in
            # the keep set, so an empty keep set would select EVERY version for
            # deletion. Refuse to prune rather than wipe the package.
            if [ "$(printf '%s' "$keep_tags" | jq 'length')" -eq 0 ]; then
              echo "::error::$package: computed an empty keep-set; refusing to prune (this would delete every version)"
              return 1
            fi
            jq -r \
              --argjson include_architectures "$include_architectures" \
              --argjson keep "$keep_tags" '
              .[]
              | . as $version
              | ($version.metadata.container.tags // []) as $tags
              # OCI image indexes reference untagged child manifests. Deleting
              # those children leaves a surviving release tag that cannot be
              # pulled, so multi-architecture packages retain untagged children.
              # Bundle packages contain no image indexes and can delete untagged
              # versions left by superseded ORAS publication layouts.
              | select(($tags | length) > 0 or $include_architectures == false)
              | select([ $tags[] | select(. as $tag | $keep | index($tag) != null) ] | length == 0)
              | $version.id
            ' "$versions_file" \
              | while IFS= read -r version_id; do
                  echo "Deleting obsolete $package package version $version_id"
                  gh api --method DELETE "/$package_namespace/$OWNER/packages/container/$package/versions/$version_id"
                done
          }

          retain_releases bleephub true
          retain_releases bleephub-runner true
          retain_releases bleephub-startup false
          retain_releases bleephub-wake false
