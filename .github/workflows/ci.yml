name: Bleephub CI

# A change touching only prose documentation cannot alter any behaviour these
# jobs check, so it should not spend runner-minutes running all of them. The
# list is deliberately an exclusion of specific documentation files rather than
# a blanket `**.md`: BUGS.md is the findings ledger that scripts/check-bugs-ledger.sh
# validates in the quality job, so a BUGS.md-only edit must still trigger the
# full pipeline. Any code, config, spec, workflow, or ledger change falls outside
# this list and runs everything.
on:
  pull_request:
    paths-ignore: &doc-paths-ignore
      - 'docs/**'
      - 'README.md'
      - 'RELEASING.md'
      - 'SECURITY.md'
      - 'THIRD-PARTY-NOTICES.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore: *doc-paths-ignore

permissions:
  contents: read

# Without this, a force-push leaves the superseded run executing all seven jobs
# to completion — roughly ninety runner-minutes spent on a commit nobody is
# waiting for, while the run that matters queues behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go server (full race + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The suite takes a little over seven minutes on a warm developer
      # machine. The previous 8m budget left about nine percent of headroom, so
      # a slower runner turned a slow suite into a timeout — which surfaces as a
      # hung test rather than a slow one, and sends whoever is on the PR looking
      # for a deadlock that isn't there.
      - name: Run the complete server suite against MinIO S3
        # -coverpkg follows the ARCH-001 module split: internal/store and
        # internal/gitstore carry no test binaries of their own — they are
        # exercised through internal/server's suite — and without cross-package
        # attribution the profile would count their statements as 0% and read
        # as a coverage collapse that never happened.
        run: go test -race -tags noui -count=1 -timeout 40m -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Enforce the Go coverage floor
        run: bash ./scripts/check-go-coverage.sh coverage.out
      # The main suite runs under `-tags noui`, which compiles the embedded SPA
      # handler out. Exercise it in the embedded build (dist is committed) so the
      # /ui/ asset + client-routing fallback contract is actually tested (TEST-021).
      - name: Exercise the embedded SPA handler (non-noui build)
        run: go test -run '^TestSPAHandler' -count=1 ./internal/server/

  quality:
    name: Go static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Keep deterministic source checks separate from the full race/coverage
      # suite above, and from the age-qualified security analyzers below, so a
      # failure names the contract that regressed.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"; echo "$unformatted"
            exit 1
          fi
      - name: Vet with the UI embedded
        run: go vet ./...
      - name: Vet without the UI
        run: go vet -tags noui ./...
      # Keep the product checks on the supported Go version above, then use
      # the independently locked tool module's minimum toolchain for analyzers.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # setup-go only parses files named go.mod; for a deliberately
          # nonstandard tool module filename, pass its exact directive.
          go-version: '1.26.6'
          cache: false
      # scripts/deadcode.sh and scripts/dupl.sh were written, made executable
      # and then referenced by nothing — no workflow, no Makefile target, no
      # documentation. dupl.sh in particular scanned the repository root at
      # depth 1, where this tree keeps no Go files at all, so it exited 1 on
      # "no Go files found" every time it was run and had never once reported
      # on the 203 files it was written for.
      #
      # Tool versions are pinned rather than @latest so a gate cannot change
      # its verdict on an unrelated pull request. deadcode tracks the x/tools
      # version the module already depends on.
      - name: Install the pinned analysis tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -mod=readonly -modfile=.github/security-go.mod \
            -o "$RUNNER_TEMP/bin/dupl" github.com/mibk/dupl
          go build -mod=readonly -modfile=.github/security-go.mod \
            -o "$RUNNER_TEMP/bin/deadcode" golang.org/x/tools/cmd/deadcode
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check for unreachable functions
        run: ./scripts/deadcode.sh
      - name: Check for copy-pasted Go code
        run: ./scripts/dupl.sh
      # The workflows and the shell scripts they call had no linting of their
      # own, so the class of mistake that only shows up on a runner — a bad
      # expression, an unquoted expansion, a step referring to a script that
      # was renamed — could only be found by pushing. Both tools report clean
      # on this tree today.
      - name: Install the pinned workflow linter
        run: |
          go build -mod=readonly -modfile=.github/workflow-tools-go.mod \
            -o "$RUNNER_TEMP/bin/actionlint" github.com/rhysd/actionlint/cmd/actionlint
      - name: Lint the workflows
        run: actionlint .github/workflows/*.yml
      - name: Lint the shell scripts
        run: shellcheck scripts/*.sh docker/*.sh test/runner/sockerless/*.sh web/e2e/*.sh
      - name: Test bounded command retries
        run: ./scripts/test-retry-command.sh
      # The findings ledger is edited constantly and by several hands, and a
      # row that loses its status column or reuses an identifier is still valid
      # markdown — it just quietly drops a finding. That happened twice before
      # this check existed.
      - name: Check the findings ledger
        run: ./scripts/check-bugs-ledger.sh
      - name: Check the generated parity inventory
        run: ./scripts/parity_inventory.py --check
      - name: Prevent new wall-clock dependencies in tests
        run: ./scripts/check-test-clock-dependencies.py
      - name: Require the current official GitHub REST definition
        run: ./scripts/check-github-openapi-drift.sh
      - name: Require the current official GitHub GraphQL schema
        run: ./scripts/check-github-graphql-schema-drift.sh

  security:
    name: Security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - *checkout
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The analyzers deliberately live in a separate Go 1.26 module so
          # their release cadence cannot force the product module forward.
          go-version: '1.26.6'
          cache: false
      - name: Install age-qualified security analyzers
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -mod=readonly -modfile=.github/security-go.mod \
            -o "$RUNNER_TEMP/bin/gosec" github.com/securego/gosec/v2/cmd/gosec
          go build -mod=readonly -modfile=.github/security-go.mod \
            -o "$RUNNER_TEMP/bin/govulncheck" golang.org/x/vuln/cmd/govulncheck
          go build -mod=readonly -modfile=.github/security-go.mod \
            -o "$RUNNER_TEMP/bin/staticcheck" honnef.co/go/tools/cmd/staticcheck
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Enforce the dependency quarantine window
        run: ./scripts/check-dependency-age.py go nuget terraform docker actions runner
        env:
          # Action commit metadata comes from api.github.com. Authenticate the
          # read-only requests so repeated PR reruns cannot exhaust the shared
          # anonymous-IP rate limit and turn the age policy into a flaky gate.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run staticcheck and gosec in every Go module
        run: |
          set -euo pipefail
          for module in . sdk-tests terraform/wake test/terraform-sockerless; do
            echo "::group::$module"
            (cd "$module" && staticcheck ./...)
            # G101 treats public context keys and token-prefix constants as
            # credentials. Trivy's dedicated secret scanner remains blocking.
            (cd "$module" && gosec -quiet -exclude=G101 ./...)
            echo "::endgroup::"
          done
      - name: Reject reachable Go vulnerabilities in every module
        run: |
          set -euo pipefail
          for module in . sdk-tests terraform/wake test/terraform-sockerless; do
            echo "::group::$module"
            (cd "$module" && govulncheck ./...)
            echo "::endgroup::"
          done
      - name: Install pinned Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --disable-pip-version-check \
            --require-hashes -r .github/security-requirements.txt
      - name: Enforce quarantine across the installed Python analyzer graph
        env:
          BLEEPHUB_PYTHON: ${{ runner.temp }}/semgrep/bin/python
        run: ./scripts/check-dependency-age.py python
      - name: Audit workflow supply-chain boundaries
        run: |
          "$RUNNER_TEMP/semgrep/bin/zizmor" .github/workflows
      - name: Run security and secret SAST rules
        run: |
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan \
            --config p/security-audit \
            --config p/secrets \
            --metrics=off \
            --error \
            --exclude web/node_modules \
            --exclude web/dist \
            .
      # Reachability-aware govulncheck (above) is the authoritative Go-vulnerability
      # gate and `bun audit` (Web job) covers npm, so Trivy's non-reachability
      # module-graph `vuln` class here would only add false positives for
      # unreachable advisories. Trivy runs the misconfig + secret scanners it
      # uniquely provides; the release-image job scans OS packages for CVEs.
      # The Dockerfile-misconfig scan targets the published runtime image
      # (Dockerfile.release, which runs non-root with a HEALTHCHECK). The other
      # Dockerfiles are disposable, never-published CI test harnesses whose
      # flagged "misconfigs" are intentional: the sockerless integration image
      # must run as root to drive the mounted Docker socket, and a finite test
      # job has no HEALTHCHECK to consume. They are skipped rather than carrying
      # a suppression each.
      - name: Scan infrastructure and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          skip-dirs: web/node_modules,web/dist
          skip-files: Dockerfile.gh-test,Dockerfile.runner,test/shauth/Dockerfile,test/runner/sockerless/Dockerfile,test/runner/sockerless/Dockerfile.spawn-runner
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'

  fuzz:
    name: Go fuzz burst
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # An ordinary `go test` only replays the seed corpus; it never asks the
      # fuzz engine to mutate an input. Run every discovered target separately
      # because Go permits one -fuzz match per process. At 28 targets × 15s the
      # mutation budget is seven minutes, with the remaining job time reserved
      # for compilation and worker startup.
      - name: Mutate every fuzz target
        run: ./scripts/fuzz.sh

  modules:
    name: Nested Go modules
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - *checkout
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # sdk-tests, terraform/wake and test/terraform-sockerless are separate
      # modules, and `go test ./...` from the root module cannot cross a module
      # boundary — so roughly 2,600 lines of test code, including the entire
      # go-github conformance suite and the only test for the Lambda that gates
      # all production traffic, was never compiled by CI at all.
      #
      # Building and vetting every module runs here. The wake module's tests are
      # self-contained and run too. sdk-tests owns an ephemeral Bleephub
      # process in TestMain, so it is a real conformance suite and must run,
      # not merely compile. terraform-sockerless needs AWS and stays
      # build-and-vet until that harness is wired up.
      - name: Build and vet every nested module
        run: |
          set -euo pipefail
          for module in sdk-tests terraform/wake test/terraform-sockerless; do
            echo "::group::$module"
            (cd "$module" && go build ./... && go vet ./...)
            echo "::endgroup::"
          done
      - name: Test the wake controller
        run: cd terraform/wake && go test -count=1 ./...
      - name: Run the official go-github conformance suite
        run: cd sdk-tests && go test -count=1 -timeout 10m ./...
      # A fourth module must not be able to arrive unnoticed the way these three
      # did. Discovering go.mod files and checking them against the list above
      # makes that a build failure rather than a silence.
      - name: Assert every module is covered
        run: |
          set -euo pipefail
          expected=$'./go.mod\n./sdk-tests/go.mod\n./terraform/wake/go.mod\n./test/terraform-sockerless/go.mod'
          found=$(find . -name go.mod -not -path './web/*' | sort)
          if [ "$found" != "$(printf '%s' "$expected" | sort)" ]; then
            echo "Go modules changed. Found:"; echo "$found"
            echo "Update the loop above and this list together."
            exit 1
          fi

  images:
    name: Release images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Both release Dockerfiles were built for the first time on push to main,
      # after review had already happened — so a Dockerfile change could only
      # be discovered broken once it was unreviewable and the publish had
      # already failed.
      #
      # This also compiles dqlite-node, which is the only build of it anywhere.
      # It sits behind `//go:build dqlite` and needs libdqlite headers, so
      # `go build ./...` and `go vet ./...` both skip the file silently; the
      # release image's dqlite-builder stage installs the headers and is the
      # one place it is type-checked at all.
      #
      # Reads the publish workflow's cache and writes its own, so a pull request
      # gets warm layers without being able to poison what main publishes.
      - name: Build the release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          push: false
          load: true
          tags: bleephub:ci
          cache-from: |
            type=gha,scope=bleephub-ci-amd64
            type=gha,scope=bleephub-amd64
          cache-to: type=gha,scope=bleephub-ci-amd64,mode=max
      - name: Scan the release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: bleephub:ci
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build the runner image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          push: false
          load: true
          tags: bleephub-runner:ci
          cache-from: |
            type=gha,scope=bleephub-runner-ci-amd64
            type=gha,scope=bleephub-runner-amd64
          cache-to: type=gha,scope=bleephub-runner-ci-amd64,mode=max
      - name: Scan the runner image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: bleephub-runner:ci
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      # The two release bundles are shell scripts run only by the publish
      # workflow, so a syntax error or a broken cross-compile in either reached
      # main unbuilt as well.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the startup and wake bundles
        run: |
          set -euo pipefail
          BLEEPHUB_VERSION=ci BLEEPHUB_PUBLISHED_AT=1970-01-01T00:00:00Z \
            scripts/build-bleephub-startup.sh .build/bleephub-ecs
          scripts/build-bleephub-wake.sh .build/bleephub-wake
          test -s .build/bleephub-ecs/bleephub-startup.zip
          test -s .build/bleephub-wake/bleephub-wake.zip

  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - *checkout
      - &setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      # setup-bun caches only the bun binary, not resolved packages, so every run
      # re-downloaded the whole dependency closure. This restores bun's global
      # install cache keyed on the lockfile — the same cache Dockerfile.release
      # mounts at /root/.bun/install/cache — so a warm run reuses it and a lockfile
      # change invalidates it.
      - &bun-install-cache
        name: Cache the bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-
      - name: Install locked web dependencies
        run: cd web && bun install --frozen-lockfile
      - name: Enforce the transitive dependency quarantine window
        run: ./scripts/check-dependency-age.py bun
      - name: Audit the locked web dependency graph
        run: cd web && bun audit
      - name: Type-check and test the web application
        run: cd web && bun run typecheck && bun run test:coverage
      # third_party/github-openapi.d.ts is a committed witness of the vendored
      # spec: it must be a byte-for-byte regeneration of third_party/
      # github-openapi.json.gz, so a spec bump that was not regenerated (or a
      # hand-edit) fails here rather than silently drifting the web contract.
      - name: Verify the generated web API types match the pinned spec
        run: ./scripts/check-web-openapi-types-drift.sh
      # CORE-013: the embedded UI (internal/server/dist, go:embed'd by
      # ui_embed.go) is a GENERATED Vite artifact and is deliberately NOT
      # committed — it is gitignored except for a .gitkeep, and rebuilt by the
      # release image (Dockerfile.release ui-builder stage) and `make build`.
      # Because nothing generated is committed, it cannot go stale, so there is
      # no freshness gate to run. This step still builds the app so a broken
      # production build fails CI.
      - name: Build the web application
        run: cd web && bun run build
      # The web counterparts of the same two orphaned gates. knip reported
      # e2e/shauth-sso.mjs as an unused file because it is launched by
      # scripts/test-shauth-sso.sh rather than imported; it is declared as an
      # entry point alongside the webhook receiver, which had the same shape
      # and was already declared.
      - name: Check for dead TypeScript exports
        run: ./scripts/knip.sh
      - name: Check for copy-pasted TypeScript
        run: ./scripts/jscpd.sh

  terraform:
    name: Terraform module
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - *checkout
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - name: Check module-input parser compatibility
        run: |
          ./scripts/check-terraform-input-validations.py --self-test
          ./scripts/check-terraform-input-validations.py
      - name: Initialize the module
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Check formatting and configuration
        run: terraform fmt -check -recursive terraform && terraform -chdir=terraform validate
      - name: Exercise dedicated, shared, and invalid VPC Link contracts
        run: terraform -chdir=terraform test

  gh-cli:
    name: GitHub CLI compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - name: Exercise the official GitHub CLI against Bleephub
        run: make gh-test

  browser:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - *setup-bun
      - *bun-install-cache
      - name: Build server and web application
        run: make build
      - name: Install Chromium and run the real browser suite
        run: cd web && npx playwright install --with-deps chromium && SERVER_BIN=../bleephub-server bun run test:e2e

  shauth-sso:
    name: Shauth SSO browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      # This job integration-tests bleephub's SSO against the real shauth OIDC
      # provider, so it necessarily depends on the e6qu/shauth repository — one
      # of only two external repos any CI job needs (the other is e6qu/sockerless
      # below). Both are pinned to an exact commit for the same reason: an
      # unpinned default branch makes this job's verdict depend on a push to a
      # different repository, so a green pull request could turn red (or the
      # reverse, which is worse) without anyone touching it. Bumping the pin is a
      # deliberate, reviewable change made in lockstep with any structural change
      # on the shauth side.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: e6qu/shauth
          ref: 08f5a78fb8b159fcbfe8317f24f430dbdfd3ed56
          path: .test-deps/shauth
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - *setup-bun
      - *bun-install-cache
      - name: Install locked browser dependencies and Chromium
        run: cd web && bun install --frozen-lockfile && npx playwright install --with-deps chromium
      - name: Exercise direct, catalog, identity, packages, SSO, and global logout flows
        run: SHAUTH_SOURCE_DIR="$GITHUB_WORKSPACE/.test-deps/shauth" make shauth-sso-test

  runner-sockerless:
    name: Runner against Sockerless
    runs-on: ubuntu-latest
    # 15 min sat right on top of this job's real runtime: it exercises the
    # official runner + a real backend through 15 sequential integration tests,
    # each waiting up to 120-300s for a run to settle, so a passing run lands
    # ~12-14 min and a load spike tipped it over 15 — the job got SIGTERM'd
    # mid-test (make Error 143 / step exit 124), a recurring "flake" that always
    # passed on rerun. 25 min gives a passing run comfortable headroom while a
    # genuine hang still fails, so this removes the flake without masking bugs.
    timeout-minutes: 25
    # This job builds an image from the PR's checked-out code and runs it with
    # the host Docker socket bind-mounted (make runner-sockerless-test). Never
    # do that for code from a fork: it would grant untrusted PR code control of
    # the runner's Docker daemon, i.e. host compromise. Runs on push and on
    # same-repository pull requests only; fork PRs skip it (CI-038).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - *checkout
      # Pinned to a commit for the same reason the shauth checkout above is:
      # an unpinned default branch makes this job's verdict depend on a push to
      # a different repository, so a green pull request can turn red without
      # anyone touching it — and the reverse, which is worse.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
