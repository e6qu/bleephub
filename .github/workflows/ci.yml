name: Bleephub CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Without this, a force-push leaves the superseded run executing all seven jobs
# to completion — roughly ninety runner-minutes spent on a commit nobody is
# waiting for, while the run that matters queues behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # The suite takes a little over seven minutes on a warm developer
      # machine. The previous 8m budget left about nine percent of headroom, so
      # a slower runner turned a slow suite into a timeout — which surfaces as a
      # hung test rather than a slow one, and sends whoever is on the PR looking
      # for a deadlock that isn't there.
      - name: Run the complete server suite against MinIO S3
        run: go test -tags noui -count=1 -timeout 20m ./...

  quality:
    name: Go static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # There was no static analysis of any kind: no vet, no format check, no
      # linter, across roughly 180 non-test Go files. This is the first gate,
      # deliberately limited to checks the tree already passes so it starts
      # green and stays meaningful. golangci-lint, -race, coverage and
      # govulncheck are tracked separately — each needs real defects fixed
      # before it can be switched on, and a gate that is red on arrival gets
      # ignored.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"; echo "$unformatted"
            exit 1
          fi
      - name: Vet with the UI embedded
        run: go vet ./...
      - name: Vet without the UI
        run: go vet -tags noui ./...

  modules:
    name: Nested Go modules
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # sdk-tests, terraform/wake and test/terraform-sockerless are separate
      # modules, and `go test ./...` from the root module cannot cross a module
      # boundary — so roughly 2,600 lines of test code, including the entire
      # go-github conformance suite and the only test for the Lambda that gates
      # all production traffic, was never compiled by CI at all.
      #
      # Building and vetting every module runs here. The wake module's tests are
      # self-contained and run too; sdk-tests needs a live server and
      # terraform-sockerless needs AWS, so those stay build-and-vet until their
      # harnesses are wired up.
      - name: Build and vet every nested module
        run: |
          set -euo pipefail
          for module in sdk-tests terraform/wake test/terraform-sockerless; do
            echo "::group::$module"
            (cd "$module" && go build ./... && go vet ./...)
            echo "::endgroup::"
          done
      - name: Test the wake controller
        run: cd terraform/wake && go test -count=1 ./...
      # A fourth module must not be able to arrive unnoticed the way these three
      # did. Discovering go.mod files and checking them against the list above
      # makes that a build failure rather than a silence.
      - name: Assert every module is covered
        run: |
          set -euo pipefail
          expected=$'./go.mod\n./sdk-tests/go.mod\n./terraform/wake/go.mod\n./test/terraform-sockerless/go.mod'
          found=$(find . -name go.mod -not -path './web/*' | sort)
          if [ "$found" != "$(printf '%s' "$expected" | sort)" ]; then
            echo "Go modules changed. Found:"; echo "$found"
            echo "Update the loop above and this list together."
            exit 1
          fi

  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Install locked web dependencies
        run: cd web && bun install --frozen-lockfile
      - name: Type-check and test the web application
        run: cd web && bun run typecheck && bun run test
      - name: Build the embedded web application
        run: cd web && bun run build

  terraform:
    name: Terraform module
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.13.5
      - name: Initialize the module
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Check formatting and configuration
        run: terraform fmt -check -recursive terraform && terraform -chdir=terraform validate
      - name: Exercise dedicated, shared, and invalid VPC Link contracts
        run: terraform -chdir=terraform test

  gh-cli:
    name: GitHub CLI compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Exercise the official GitHub CLI against Bleephub
        run: make gh-test

  browser:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Build server and web application
        run: make build
      - name: Install Chromium and run the real browser suite
        run: cd web && npx playwright install --with-deps chromium && SERVER_BIN=../bleephub-server bun run test:e2e

  shauth-sso:
    name: Shauth SSO browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/checkout@v7.0.0
        with:
          repository: e6qu/shauth
          ref: 08f5a78fb8b159fcbfe8317f24f430dbdfd3ed56
          path: .test-deps/shauth
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Install locked browser dependencies and Chromium
        run: cd web && bun install --frozen-lockfile && npx playwright install --with-deps chromium
      - name: Exercise direct, catalog, identity, packages, SSO, and global logout flows
        run: SHAUTH_SOURCE_DIR="$GITHUB_WORKSPACE/.test-deps/shauth" make shauth-sso-test

  runner-sockerless:
    name: Runner against Sockerless
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/checkout@v7.0.0
        with:
          repository: e6qu/sockerless
          path: sockerless
      - name: Exercise the official runner against the real simulator and backend
        run: timeout --foreground --kill-after=1m 14m env SOCKERLESS_ROOT="$GITHUB_WORKSPACE/sockerless" make runner-sockerless-test
