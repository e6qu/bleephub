version: 2

# A release must exist for a full day before an automated update may consume
# it. This limits exposure to compromised or immediately-yanked releases while
# the CI dependency-age ratchet independently checks the resolved graph.
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /gcsclient
      - /gitstore
      - /gitstore/bench
      - /sdk-tests
      - /terraform/wake
      - /test/terraform-sockerless
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  # No `docker` entry. Base images are pinned by digest on the Docker Hub
  # mirrors CI pulls from, and Dependabot's anonymous lookups on public.ecr.aws
  # exceed ECR Public's one-request-per-second limit and fail with 429; it also
  # applies no cooldown to either mirror. scripts/check-image-pins.py (the Image
  # pins workflow, daily on main) keeps those pins current instead.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: daily
    cooldown:
      default-days: 1
