name: GitHub API contract drift

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-api-contracts:
    name: Current REST and GraphQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Require the current official GitHub REST definition
        run: ./scripts/check-github-openapi-drift.sh
      - name: Require the current official GitHub GraphQL schema
        run: ./scripts/check-github-graphql-schema-drift.sh
